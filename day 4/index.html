<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>

<body>
    <br>

    <form>
        <h3>Contact Form</h3>
        <div>
            <lable for"">First Name :</lable>
            <input required type="text" class="input" placeholder="Enter First name" />
        </div>
        <br>

        <div>
            <lable for"">Last Name :</lable>
            <input required  type="text" class="input" placeholder="Enter Last name" />
        </div>
        <br>


        <div>
            <lable for"">Email :</lable>
            <input type="email" class="input" placeholder="Enter your email" required  />
        </div>
        <br>

        <div>
            <lable for"">Phone number :</lable>
            <input type="tel" class="input" placeholder="Enter your phone number" required  />
        </div>
        <br>


        <div>
            <lable for"">Gender :</lable>
            <input type="radio" name="gender" value="male" />Male
            <input type="radio" name="gender" value="female" />Female
            <input type="radio" name="gender" value="other" />Other
        </div>
        <br>


        <div>
            <lable for"">Hobbies :</lable>
            <input type="checkbox" name="cricket" value="cricket" /> cricket
            <input type="checkbox" name="cycling" value="cycling" /> cycling
            <input type="checkbox" name="listening to music " value="listening to music " /> listening to music
            <input type="checkbox" name="driving" value="driving" /> driving
        </div>
        <br>

        <div>
            <lable>File upload</lable>
            <input type="file" />
        </div>
        <br>

        <div>
            <lable>DOB :</lable>
            <input type="datetime-local"/>
        </div>
         <br>

         <div>
            <label>City</label>
           <select>
             <option>-select opiton-</option>
            <option value="delhi">delhi</option>
            <option value="mumbai">mumbai</option>
            <option value="chennai">chennai</option>
          </select>
            
         </div> <br>

         <div>
            <label>Message for us</label>
            <textarea></textarea>
         </div>

         <div>
            <button type="submit">SAVE</button>
         </div>


    </form>
</body>

</html>
