<html>

<head>
    <title>main table</title>
    <style>
        * {
            width: auto;
            height: auto;
            border: 1px;
        }

        .main {
            width: 1000px;
            height: 540px;
            background-color: bisque;
            border: 1px black solid;
        }

        .row1 {
            width: 1000px;
            height: 100px;
            background-color: aquamarine;
            text-align: center;
            border: 1px black solid;
        }

        .row2 {
            width: 1000px;
            height: 40px;
            background-color: coral;
            display: flex;
            text-align: center;
            border: 1px black solid;
        }

        .r2c1,
        .r2c2,
        .r2c3,
        .r2c4,
        .r2c5 {
            width: 200px;
            height: 40px;
            border: 1px black solid;
        }

        .row3 {
            width: 1000px;
            height: 200px;
            text-align: center;
            display: flex;
            border: 1px black solid;
        }

        .r3c1 {
            width: 250px;
            height: 200px;
            background-color: beige;
            border: 1px black solid;
        }

        .r3c1b1,
        .r3c1b2,
        .r3c1b3,
        .r3c1b4,
        .r3c1b5 {
            width: 250px;
            height: 40px;
            text-align: center;
            border: 1px black solid;
        }

        .r3c2 {
            width: 750px;
            height: 200px;
            float: left;
            border: 1px black solid;
        }

        .r3c2 img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border: 1px black solid;

        }

        .row4 {
            width: 1000px;
            height: 50px;
            background-color: crimson;
            color: blanchedalmond;
            text-align: center;
            border: 1px black solid;
        }

        /* .row5{
            display: flex;
            margin-top: 20px;
        } */
        .row5 {
            height: 100px;
            width: 1000px;
         
            display: flex;
            border: 1px black solid;
        
        }

        .box1,
        .box2,
        .box3 {
            width: 333.33px;
            height: 100px;
            object-fit: cover;
            border: 1px black solid;
        }
        .row5 img{
            width: 100%;
         height: 100%;
         border: 1px black solid;
        }
        .row6{width: 1000px; height: 50px; text-align: center; background-color: chocolate;
        border: 1px black solid;}
    </style>
</head>

<body>
    <div class="main">
        <div class="row1">
            <h1>wscube tech</h1>
        </div>
        <div class="row2">
            <div class="r2c1">Home</div>
            <div class="r2c2">About</div>
            <div class="r2c3">Courses</div>
            <div class="r2c4">Gallery</div>
            <div class="r2c5">Contact Us</div>
        </div>
        <div class="row3">
            <div class="r3c1">
                <div class="r3c1b1">Home</div>
                <div class="r3c1b2">About</div>
                <div class="r3c1b3">Courses</div>
                <div class="r3c1b4">Gallery</div>
                <div class="r3c1b">Contact Us</div>
            </div>
            <div class="r3c2">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROKjcuxIQfghFd1uDaDViUKmmr-drv3dH4NNffUtUG9g&s=10"
                    alt="wscube">
            </div>
        </div>
        <div class="row4">OUR CLIENTS</div>
        <div class="row5">
            <div class="box1"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSo6wQ7rK2Me3UMAyJKG8IAa5QEUkpi1ADO63qczJM4ww&s=10"
                    alt="images"></div>
            <div class="box2"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6ZNkY4C9wIe-JYZj64ZdIj3xzgmV-TqQo54EpcbUyAg&s=10"
                    alt="images"></div>
            <div class="box3"><img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJr_FfiNrO4qOZ9Av4mG1w-zyYRFHdcU-lArpw3SJBQA&s=10"
                    alt="images"></div>

        </div>
        <div class="row6">HOME|ABOUT|COURSES|GALLERY|CONTACT US</div>
    </div>

</body>

</html>
